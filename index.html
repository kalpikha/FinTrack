<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinTrack — Personal Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-gate" id="auth-gate" hidden>
  <div class="auth-card">
    <div class="auth-brand">FinTrack</div>
    <h1 id="auth-title">Sign in</h1>
    <p class="muted" id="auth-sub">Access your personal finance workspace.</p>
    <form id="auth-form" class="form-grid" style="margin-top:10px;">
      <label class="field" hidden><span>Full name</span>
        <input class="input" id="auth-name" autocomplete="name" placeholder="Your name" />
      </label>
      <label class="field"><span>Email</span>
        <input class="input" id="auth-email" type="email" autocomplete="email" required placeholder="name@example.com" />
      </label>
      <label class="field"><span>Password</span>
        <input class="input" id="auth-password" type="password" autocomplete="current-password" required minlength="6" placeholder="Minimum 6 characters" />
      </label>
      <button class="btn primary" id="auth-submit" type="submit" style="width:100%;">Sign in</button>
    </form>
    <p class="muted" style="margin-top:10px;">
      <button class="btn ghost sm" id="auth-toggle" type="button">Create account</button>
    </p>
  </div>
</div>

<div class="app" id="app-shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">F</div>
      <div>
        <div class="logo-name">FinTrack</div>
        <div class="logo-tag">Personal Finance</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l9-9 9 9"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h13l-3-3"/><path d="M21 17H8l3 3"/></svg>
        Transactions
      </button>
      <button class="nav-item" data-view="budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
        Budgets
      </button>
      <button class="nav-item" data-view="goals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        Goals
      </button>
      <button class="nav-item" data-view="accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        Accounts
      </button>
      <button class="nav-item" data-view="recurring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        Recurring
      </button>
      <button class="nav-item" data-view="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V9"/><path d="M12 16v-5"/><path d="M16 16V7"/></svg>
        Reports
      </button>
    </nav>

    <div class="nav-footer">
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0 1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8 2 2 0 1 1 2.8-2.8 1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" class="muted"></p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="user-badge" id="active-user" title="Signed in user"></span>
        <input type="month" id="period" class="input compact" />
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn ghost" id="logout-btn" type="button">Logout</button>
        <button class="btn primary" id="quick-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>
      </div>
    </header>

    <div class="view" id="view-root"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modal-title">Add transaction</h2>
      <button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<input type="file" id="import-file" accept=".json,.csv" hidden />

<script type="module" src="/src/main.js"></script>
</body>
</html>
